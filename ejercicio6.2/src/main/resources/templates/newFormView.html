<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Nuevo curso</h1>

    <div class="alert alert-danger" th:if="${msgError}" th:text="${msgError}"></div>

    <form method="post" action="#" th:action="@{/nuevo/submit}" th:object="${cursoForm}" class="w-50">
        <div class="mb-2">
            <label class="form-label">Id:</label>
            <input type="number" th:field="*{id}" class="form-control"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Nombre:</label>
            <input type="text" th:field="*{nombre}" class="form-control"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Precio:</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control"/>
        </div>
        <div class="mb-2">
            <label class="form-label">Temática:</label>
            <select th:field="*{tematica}" class="form-select">
                <option th:each="tem : ${T(com.example.cursos.domain.Tematica).values()}"
                        th:value="${tem}" th:text="${tem}"></option>
            </select>
        </div>
        <input type="submit" value="Enviar" class="btn btn-dark"/>
        <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
