<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Detalle del curso</h1>
    <table class="table w-50">
        <tr><th>ID</th><td th:text="${curso.id}"></td></tr>
        <tr><th>Nombre</th><td th:text="${curso.nombre}"></td></tr>
        <tr><th>Precio</th><td th:text="${curso.precio}"></td></tr>
        <tr><th>Temática</th><td th:text="${curso.tematica}"></td></tr>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Volver</a>
</div>
</body>
</html>
